<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Explorer</title>
<!-- Plan Explorer engine. Do not edit per-project: all content lives in plan.js next to this file. -->
<script>
  try {
    const t = localStorage.getItem("pe:theme");
    if (t === "light" || t === "dark") { document.documentElement.dataset.theme = t; }
  } catch (e) {}
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="plan.js"></script>
<style>
:root {
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 260px;
  --bg: #ffffff; --ink: #18181a; --ink-2: #3c3c40; --ink-3: #6e6e74;
  --rule: #2a2a2e; --rule-soft: #e5e5e8; --panel: #f5f5f6; --note-bg: #fbeee9;
  --accent: #c2553d; --tint: #c2553d17; --on-accent: #ffffff;
  --m-q: #c2553d; --m-c: #b9822c; --m-i: #4b6f9e; --m-y: #4f8768; --m-x: #8f8b83; --m-n: #3a3833;
  --sev-high: #a8442e; --sev-high-bg: #f5e2db; --sev-med: #8a6118; --sev-med-bg: #f4eadb; --sev-low: #47658c; --sev-low-bg: #e4ebf2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --ink: #f0f0f2; --ink-2: #c9c9ce; --ink-3: #8d8d94;
    --rule: #d4d4d8; --rule-soft: #2b2b30; --panel: #1b1b1f; --note-bg: #2c211c;
    --accent: #df7f66; --tint: #df7f6624; --on-accent: #161614;
    --m-q: #df7f66; --m-c: #d9a85a; --m-i: #86a5d1; --m-y: #84b599; --m-x: #8a867e; --m-n: #cfccc4;
    --sev-high: #eb9c87; --sev-high-bg: #35231d; --sev-med: #e0bd7e; --sev-med-bg: #332a1b; --sev-low: #9db8db; --sev-low-bg: #1e2734;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --ink: #f0f0f2; --ink-2: #c9c9ce; --ink-3: #8d8d94;
  --rule: #d4d4d8; --rule-soft: #2b2b30; --panel: #1b1b1f; --note-bg: #2c211c;
  --accent: #df7f66; --tint: #df7f6624; --on-accent: #161614;
  --m-q: #df7f66; --m-c: #d9a85a; --m-i: #86a5d1; --m-y: #84b599; --m-x: #8a867e; --m-n: #cfccc4;
  --sev-high: #eb9c87; --sev-high-bg: #35231d; --sev-med: #e0bd7e; --sev-med-bg: #332a1b; --sev-low: #9db8db; --sev-low-bg: #1e2734;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
code { font: .86em var(--mono); background: var(--panel); padding: 1px 5px; }
kbd { font: 700 10px var(--mono); border: 1px solid currentColor; padding: 1px 4px; opacity: .7; }
button { font-family: var(--sans); }
[hidden] { display: none !important; }

/* ── sidebar ─────────────────────────────────────────── */
#side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); border-right: 1px solid var(--rule-soft); padding: 28px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: var(--bg); z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; }
.ptitle { font-size: 20px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; margin-top: 14px; }
.pmeta { font-size: 12px; color: var(--ink-3); margin-bottom: 18px; }
nav { display: flex; flex-direction: column; border-top: 2px solid var(--rule); padding-top: 6px; }
.nav { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 6px; align-items: baseline; padding: 6px 0; text-decoration: none; font-size: 14px; color: var(--ink-2); border-bottom: 1px solid var(--rule-soft); }
.nav:hover { color: var(--ink); }
.nav.on { color: var(--accent); font-weight: 700; }
.nav .nn { font: 700 11px var(--sans); color: var(--ink-3); }
.nav.on .nn { color: var(--accent); }
.navh { margin: 16px 0 2px; }
.cnt { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.cnt.hot { color: var(--accent); }
.dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; align-self: center; }
.side-foot { margin-top: auto; padding-top: 24px; display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 12px; color: var(--ink-3); margin: 0 0 6px; line-height: 1.4; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); }
.seg button { background: transparent; color: var(--ink-2); border: 0; padding: 7px 0; font: 700 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ── page ────────────────────────────────────────────── */
main { margin-left: var(--side-w); padding: 64px 150px 160px 72px; min-height: 100vh; }
.page { max-width: 780px; position: relative; }
.page.wide { max-width: 1180px; }
.kicker { font: 700 11px/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sq { width: 12px; height: 12px; background: var(--accent); display: inline-block; flex: none; }
h1 { font-size: clamp(40px, 6vw, 76px); line-height: .98; letter-spacing: -.045em; font-weight: 700; margin: 18px 0 30px; }
.lede, .lede p { font-size: 22px; line-height: 1.38; letter-spacing: -.012em; }
.lede p { margin: 0 0 14px; }
.lede-s { font-size: 17px; color: var(--ink-2); max-width: 620px; }
.sec { margin: 72px 0 20px; border-top: 2px solid var(--rule); padding-top: 14px; display: grid; grid-template-columns: 64px 1fr auto; align-items: baseline; gap: 0 8px; }
.sec .n { font: 700 13px var(--sans); color: var(--accent); letter-spacing: .04em; }
.sec h2 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.025em; }
.sec .meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; }
.body { margin-left: 72px; }
.prose p { margin: 0 0 14px; }
.prose ul, .lede ul { margin: 0 0 14px; padding-left: 0; list-style: none; }
.prose li, .lede li { padding-left: 22px; position: relative; margin-bottom: 4px; }
.prose li::before, .lede li::before { content: "–"; position: absolute; left: 0; color: var(--ink-3); }
.muted { color: var(--ink-3); }

.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 44px 1fr; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.rows li:first-child { padding-top: 2px; }
.rn { font: 700 12px/1.9 var(--sans); color: var(--ink-3); }

.tag { font: 700 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.new { background: var(--tint); color: var(--accent); border-color: transparent; }
.tag.pick { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.st-draft { color: var(--ink-3); }
.tag.st-exploring { color: var(--m-i); }
.tag.st-settled { color: var(--m-y); }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 16px 0 22px; border-top: 1px solid var(--rule); text-decoration: none; }
.card .cn { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1; color: var(--ink-3); }
.card:hover .cn { color: var(--accent); }
.card .ct { font-size: 20px; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
.card .cs { font-size: 14px; color: var(--ink-2); }

/* ── flows ───────────────────────────────────────────── */
.flow { margin: 0 0 44px; }
.flow-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--rule); padding-top: 10px; margin-bottom: 12px; }
.flow-head h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.canvas { background: var(--panel); padding: 24px; overflow-x: auto; cursor: zoom-in; min-height: 90px; }
.canvas.bad { cursor: default; }
.canvas svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.flow figcaption { font-size: 14px; color: var(--ink-2); margin-top: 10px; }
.flow figcaption p { margin: 0 0 6px; }
.err { color: var(--accent); font: 700 13px var(--sans); margin-bottom: 8px; }
.src { font: 12px/1.5 var(--mono); white-space: pre-wrap; margin: 0; color: var(--ink-2); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 36px; }
.gal-k { margin: 48px 0 14px; color: var(--ink); font-size: 12px; }
.gal-k .gn { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.chip { font: 700 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 7px 10px; border: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink-2); background: transparent; cursor: pointer; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .cc { opacity: .6; margin-left: 4px; }

/* ── options & questions ─────────────────────────────── */
.opt { border-top: 1px solid var(--rule); padding: 12px 0 22px; }
.opt.picked { border-top: 2px solid var(--m-y); }
.opt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.opt-head h3 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.015em; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 6px; }
.pl { list-style: none; margin: 6px 0 0; padding: 0; font-size: 15px; }
.pl li { display: grid; grid-template-columns: 18px 1fr; padding: 4px 0; }
.sg { font-weight: 700; color: var(--ink-3); }
.pros .sg { color: var(--m-y); }
.cons .sg { color: var(--accent); }
.qs { list-style: none; margin: 0; padding: 0; }
.qs > li { display: grid; grid-template-columns: 44px 1fr; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); }
.qn { font: 700 13px/1.7 var(--sans); color: var(--accent); }
.qt { font-size: 18px; letter-spacing: -.01em; line-height: 1.35; }
.qa { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.qa .kicker { display: inline-flex; margin-right: 8px; }

/* ── buttons ─────────────────────────────────────────── */
.btn { font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 9px 12px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; text-align: center; }
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { border-color: transparent; color: var(--ink-2); }
.btn.wide { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.lnk { background: none; border: 0; padding: 0; font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
.lnk:hover { color: var(--accent); }
.grow { flex: 1; }

/* ── marks ───────────────────────────────────────────── */
.c-q { --c: var(--m-q); } .c-c { --c: var(--m-c); } .c-i { --c: var(--m-i); }
.c-y { --c: var(--m-y); } .c-x { --c: var(--m-x); } .c-n { --c: var(--m-n); }

/* ── notes inbox ─────────────────────────────────────── */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 24px; align-items: center; }
.filt { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.filt > .kicker { width: 64px; }
.ngroup { margin-top: 40px; }
.ngroup > .kicker { color: var(--ink); border-top: 2px solid var(--rule); padding-top: 8px; }
.ncard { display: grid; grid-template-columns: 30px 1fr; gap: 14px; border-bottom: 1px solid var(--rule-soft); padding: 16px 0; }
.glyph { width: 26px; height: 26px; background: var(--c); color: var(--bg); font: 700 14px/26px var(--sans); text-align: center; }
.ncard blockquote, #pop blockquote { margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--c, var(--accent)); font-size: 14px; color: var(--ink-2); }
.ntext { font-size: 16px; margin: 6px 0; }
.nact { display: flex; gap: 16px; margin-top: 8px; }
.st { font: 700 10px var(--sans); letter-spacing: .1em; padding: 2px 5px; border: 1px solid currentColor; }
.st-open { color: var(--ink-2); }
.st-answered { color: var(--m-i); }
.st-resolved { color: var(--m-y); }
.st-warn { color: var(--m-c); }
.reply { background: var(--panel); padding: 10px 12px; font-size: 14px; margin: 8px 0; border-left: 3px solid var(--ink); }
.reply .kicker { margin-bottom: 4px; color: var(--ink); }
.reply.working { border-left-color: var(--accent); }
.reply.working .kicker::after { content: " · working…"; color: var(--accent); }
.st-asking { color: var(--accent); }
.live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin: 0 0 6px; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.live.on .dot { background: var(--sev-low); }
.live.busy .dot { background: var(--accent); animation: livepulse 1.2s ease-in-out infinite; }
.live.off .dot { background: transparent; border: 1px solid var(--ink-3); }
@keyframes livepulse { 50% { opacity: .35; } }
.empty { color: var(--ink-3); font-size: 17px; margin-top: 32px; }

/* ── issues ──────────────────────────────────────────── */
.sev-high { --sev: var(--sev-high); --sev-bg: var(--sev-high-bg); }
.sev-medium { --sev: var(--sev-med); --sev-bg: var(--sev-med-bg); }
.sev-low { --sev: var(--sev-low); --sev-bg: var(--sev-low-bg); }
.issue { border-left: 3px solid var(--sev, var(--rule-soft)); background: linear-gradient(90deg, var(--sev-bg, transparent), transparent 70%); padding: 14px 18px 16px; margin: 0 0 14px; scroll-margin-top: 24px; }
.issue-title { font-size: 19px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; margin: 0 0 6px; }
.issue-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.sevpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--sev); background: var(--sev-bg); padding: 2px 8px 2px 6px; border-radius: 999px; }
.sevpill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sev); }
.issue-meta .cat { font-weight: 500; color: var(--ink); }
.issue-meta .where code { font-size: 12px; background: none; padding: 0; color: var(--ink-2); }
.issue-meta .soft { color: var(--ink-3); }
.issue-sum { font-size: 16px; margin: 0 0 8px; }
.ifields { display: grid; grid-template-columns: 76px 1fr; gap: 6px 14px; font-size: 14.5px; color: var(--ink-2); margin: 0; }
.ifields dt { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
.ifields dd { margin: 0; }
.ifields dd p { margin: 0 0 6px; }
.ifields dd p:last-child { margin: 0; }
.ifields dt.fix { color: var(--m-y); }
.issue-rel { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); }
.issue-rel a { font-size: 12px; text-decoration: none; border: 1px solid var(--rule-soft); padding: 1px 7px; color: var(--ink-2); }
.issue-rel a:hover { border-color: var(--ink-3); color: var(--ink); }
.issue.st-fixed, .issue.st-wontfix { opacity: .62; }
.istatus { font-size: 12px; color: var(--ink-3); }
.istatus.fixed { color: var(--m-y); }
.sevbar { display: flex; gap: 6px; margin: 8px 0 0; flex-wrap: wrap; }

/* ── API docs ────────────────────────────────────────── */
.page.mid { max-width: 1000px; }
.sig { font: 13px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
.sig .k { color: var(--m-i); }
.sig .t { font-weight: 700; }
.sig .s { color: var(--m-y); }
.sig .c { color: var(--ink-3); }
.apitools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 28px 0 12px; }
.search { flex: 1 1 280px; font: 16px var(--sans); padding: 10px 12px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); outline: none; border-radius: 0; }
.search:focus { box-shadow: inset 0 -2px 0 var(--accent); }
.seg.inline { display: inline-grid; grid-template-columns: repeat(3, auto); }
.seg.inline button { padding: 8px 12px; }
.chips + .chips { margin-top: 0; }
.type { border-top: 1px solid var(--rule); padding: 14px 0 24px; scroll-margin-top: 24px; }
.type-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.type-name { font: 700 22px/1.2 var(--mono); letter-spacing: -.02em; margin: 0; }
.type-meta { margin: 6px 0 8px; }
.srcpath { font: 12px var(--mono); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.type-sum { font-size: 16px; margin: 4px 0 10px; }
.members { width: 100%; border-collapse: collapse; margin-top: 10px; }
.members td { vertical-align: top; padding: 9px 0; border-top: 1px solid var(--rule-soft); }
.members td.msig { width: 52%; padding-right: 24px; }
.members td.mdoc { font-size: 14px; color: var(--ink-2); }
.members .tag { display: inline-block; margin-top: 4px; margin-right: 4px; }
.mgroup td { font: 700 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding-top: 18px; border-top: 0; }
.mfull { margin-top: 6px; }
.mfull p { margin: 0 0 6px; }
.params { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
.params li { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 12px; padding: 2px 0; }
.params code { background: none; padding: 0; font-weight: 700; color: var(--ink); }
.ret { font-size: 13px; margin-top: 4px; }
.ret .kicker { display: inline-flex; margin-right: 8px; }
.deps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.deps .kicker { width: 92px; }
.dep { font: 12px var(--mono); padding: 3px 7px; border: 1px solid var(--rule-soft); background: transparent; color: var(--ink-2); }
button.dep { cursor: pointer; }
button.dep:hover { border-color: var(--ink); color: var(--ink); }
.tag.s-new, .tag.s-proposed { color: var(--m-y); }
.tag.s-changed { color: var(--m-c); }
.tag.s-removed { color: var(--ink-3); text-decoration: line-through; }
tr.m-removed .sig { text-decoration: line-through; opacity: .6; }
.hit { background: var(--tint); color: var(--accent); }
.canvas g.node[data-goto-type] { cursor: pointer; }
svg g.node.pe-has-svg > rect, svg g.node.pe-has-svg > path { stroke: var(--accent) !important; stroke-width: 2.5px !important; }
svg g.node.pe-hover-svg > rect, svg g.node.pe-hover-svg > path { stroke: var(--accent) !important; stroke-width: 3px !important; }


/* ── v2: explore, drawer, api tree, canvases ─────────── */
.page.mid { max-width: 1040px; }
.page.wide { max-width: 1320px; }
nav .nav { grid-template-columns: 1fr auto; font-size: 15px; padding: 9px 0; }
.goals { margin: 4px 0 24px; }
.goals summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.goalgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 12px; }
.xbar { margin: 28px 0 10px; display: flex; }
.facets { display: flex; flex-direction: column; gap: 6px; padding-bottom: 18px; border-bottom: 1px solid var(--rule-soft); }
.frow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.frow > .kicker { width: 72px; flex: none; }
.fsep { width: 12px; }
.chip { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 999px; }
.sevchip .idot { margin-right: 6px; }
.xarea { padding: 28px 0 8px; border-bottom: 1px solid var(--rule-soft); }
.xhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.xn { font: 700 13px var(--sans); color: var(--accent); text-decoration: none; }
.xt { font-size: 26px; font-weight: 700; letter-spacing: -.02em; text-decoration: none; }
.xt:hover { color: var(--accent); }
.xpills { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.xsum { color: var(--ink-2); margin: 4px 0 18px; max-width: 760px; }
.xblock { margin: 18px 0; }
.xblock > .kicker, .irows > .kicker { margin-bottom: 6px; }
.xsection { margin: 18px 0; }
.xsection h3 { font-size: 16px; margin: 0 0 6px; }

<body>
<aside id="side"></aside>
<main><div id="page" class="page"></div></main>
<div id="pins"></div>
<button id="selbtn" class="btn primary" hidden>✎ Note</button>
<div id="pop" hidden></div>

<aside id="drawer" hidden></aside>
<div id="tip" hidden></div>
<div id="nmbar" hidden>Note mode · click anything · Esc to exit</div>
<div id="toast"></div>
<script>
(() => {
"use strict";
const ENGINE_VERSION = "2.1.0";
let P = window.PLAN;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").replace(/\s+/g, " ").trim();
const pad = n => String(n).padStart(2, "0");
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const now = () => new Date().toISOString();

if (!P) {
  document.body.innerHTML = `<main style="margin:0;padding:64px"><h1>No plan loaded</h1><p>Put a <code>plan.js</code> next to this file that sets <code>window.PLAN = { … }</code>.</p></main>`;
  return;
}
document.title = P.title || "Plan Explorer";

// ── storage ─────────────────────────────────────────────────────────────
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const NOTES_KEY = `pe:${P.id || P.title}:notes`;
let notes = store.get(NOTES_KEY, []);
if (!Array.isArray(notes)) { notes = []; }

// ── marks ───────────────────────────────────────────────────────────────
const MARKS = [
  { v: "?", key: "?", name: "Question", cls: "q" },
  { v: "!", key: "!", name: "Concern", cls: "c" },
  { v: "+", key: "+", name: "Idea", cls: "i" },
  { v: "✓", key: "✓", name: "Agree", cls: "y" },
  { v: "✗", key: "✗", name: "Cut", cls: "x" }
];
const NO_MARK = { v: "", key: "•", name: "Note", cls: "n" };
const markOf = v => MARKS.find(m => m.v === v) || NO_MARK;
const PREFIXES = [["?", "?"], ["!", "!"], ["+", "+"], ["✓", "✓"], ["✗", "✗"], ["ok ", "✓"], ["x ", "✗"]];
function parsePrefix(text) {
  const t = text.trimStart();
  for (const [p, m] of PREFIXES) {
    if (p.length > 1) {
      if (t.toLowerCase().startsWith(p)) { return { mark: m, rest: t.slice(p.length).trim() }; }
    } else if (t[0] === p && (t.length === 1 || /\s/.test(t[1]))) {
      return { mark: m, rest: t.slice(1).trim() };
    }
  }
  return null;
}

// ── tiny markdown ───────────────────────────────────────────────────────
const MD_LINK = /\[([^\]]+)\]\(([^)\s]+)\)/g;
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(MD_LINK, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function plain(s) {
  return norm(String(s ?? "")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1$2")
    .replace(MD_LINK, "$1"));
}
const textHtml = s => String(s ?? "").split("\n").map(inline).join("<br>");
const firstPara = s => String(s ?? "").trim().split(/\n\s*\n/)[0];

// ── element index: every noteable thing has a stable nid ────────────────
const INDEX = new Map();
const FLOWS = new Map();
function routeOf(nid) {
  const s = nid.split("/");
  if (s[0] === "areas") { return "explore/" + s[1]; }
  if (s[0] === "roadmap") { return "roadmap"; }
  if (s[0] === "api") { return s[1] && s[1] !== "graph" && s[1] !== "summary" && typeById(s[1]) ? "api/" + s[1] : "api"; }
  return "explore";
}
function reg(nid, label, text) {
  if (!INDEX.has(nid)) { INDEX.set(nid, { label, text: norm(text), route: routeOf(nid) }); }
  return ` data-nid="${esc(nid)}"`;
}
function md(text, base, label) {
  const blocks = String(text ?? "").trim().split(/\n\s*\n/).filter(Boolean);
  let p = 0;
  let li = 0;
  const isItem = l => /^\s*[-*] /.test(l);
  // A block can mix a lead-in line with a list ("Two bugs:\n- a\n- b"); split it into runs.
  const runs = [];
  for (const b of blocks) {
    for (const l of b.split("\n")) {
      const last = runs[runs.length - 1];
      if (last && last.list === isItem(l) && last.block === b) {
        last.lines.push(l);
      } else {
        runs.push({ block: b, list: isItem(l), lines: [l] });
      }
    }
  }
  return runs.map(({ list, lines }) => {
    if (list) {
      return `<ul>${lines.map(l => {
        const t = l.replace(/^\s*[-*] /, "");
        const nid = `${base}/li${li}`;
        li += 1;
        return `<li${reg(nid, `${label} › item ${li}`, plain(t))}>${inline(t)}</li>`;
      }).join("")}</ul>`;
    }
    const nid = `${base}/p${p}`;
    p += 1;
    const t = lines.join("\n").replace(/\s*\n\s*/g, " ");
    return `<p${reg(nid, `${label} › ¶${p}`, plain(t))}>${inline(t)}</p>`;
  }).join("");
}

// ── plan helpers ────────────────────────────────────────────────────────
const areas = () => P.areas || [];
const areaById = id => areas().find(a => a.id === id);
const isChanged = o => o && o.rev != null && P.version != null && Number(o.rev) === Number(P.version);
const chg = o => (isChanged(o) ? `<span class="tag new">Changed v${esc(P.version)}</span>` : "");
function areaChanged(a) {
  const kids = [...(a.flows || []), ...(a.issues || []), ...(a.sections || []), ...(a.options || []), ...(a.openQuestions || [])];
  return isChanged(a) || kids.some(isChanged);
}
const statusTag = s => (s ? `<span class="tag st-${esc(s)}">${esc(s)}</span>` : "");
function sec(n, title, nid, label, meta = "") {
  return `<div class="sec"${nid ? reg(nid, label, title) : ""}><span class="n">${esc(n)}</span><h2>${esc(title)}</h2><span class="meta">${meta}</span></div>`;
}

// ── note state helpers ──────────────────────────────────────────────────
// A live answer (from the sidecar) wins over a reply baked into plan.js.
function replyOf(n) {
  const a = live.answers[n.id];
  if (a && (a.text || a.status === "working")) { return { text: a.text, by: a.by, working: a.status === "working" }; }
  return (P.replies || {})[n.id] || null;
}
function statusOf(n) {
  if (n.status === "resolved") { return "resolved"; }
  const r = replyOf(n);
  return r && !r.working ? "answered" : "open";
}
function locate(n) {
  const a = n.anchor || {};
  const hit = INDEX.get(a.nid);
  const q = norm(a.quote);
  if (hit && (!q || hit.text.includes(q) || (a.kind !== "text" && q.includes(hit.text)))) {
    return { nid: a.nid, state: "ok" };
  }
  if (q.length >= 4) {
    for (const [nid, e] of INDEX) {
      if (e.text.includes(q)) { return { nid, state: "moved" }; }
    }
  }
  if (hit) { return { nid: a.nid, state: "changed" }; }
  return { nid: null, state: "orphaned" };
}
const noteById = id => notes.find(n => n.id === id);
function groupName(nid) {
  const r = routeOf(nid);
  if (r.startsWith("explore/")) { const a = areaById(r.slice(8)); return a ? a.title : r; }
  if (r.startsWith("api")) { return "API"; }
  return r === "roadmap" ? "Roadmap" : "Overview";
}

// ── plan lookups ────────────────────────────────────────────────────────
const SEVERITIES = ["high", "medium", "low"];
const sevKey = s => String(s || "").toLowerCase();
const sevRank = s => {
  const i = SEVERITIES.indexOf(sevKey(s));
  return i < 0 ? 3 : i;
};
const bySev = (x, y) => sevRank((x.i || x).severity) - sevRank((y.i || y).severity);
const sevClass = s => (SEVERITIES.includes(sevKey(s)) ? `sev-${sevKey(s)}` : "");
const sevLabel = s => (s ? String(s)[0].toUpperCase() + String(s).slice(1) : "");
const ORIGIN = { "pre-existing": "Also on base", introduced: "Introduced here" };
const ISSUE_FIELDS = [["trigger", "When"], ["cause", "Cause"], ["impact", "Impact"], ["fix", "Fix"], ["verify", "Verify"]];
const allIssues = () => areas().flatMap(a => (a.issues || []).map(i => ({ a, i })));
const isOpenIssue = i => !i.status || i.status === "open" || i.status === "fixing";
const issueNid = (a, i) => `areas/${a.id}/issues/${i.id}`;
function findIssue(areaId, id) {
  const a = areaById(areaId);
  const i = a && (a.issues || []).find(x => x.id === id);
  return i ? { a, i } : null;
}
const apiTypes = () => (P.api && P.api.types) || [];
const typeById = id => apiTypes().find(t => t.id === id);
const resolveType = d => apiTypes().find(x => x.id === d || x.name === d);
const fileOf = s => String(s || "").replace(/:[\d,\- ]+$/, "");
const squash = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const has = (q, ...xs) => xs.some(x => x && String(x).toLowerCase().includes(q));

function flowOfIssue(a, i) {
  return (a.flows || []).find(f => i.flow === f.id || i.flow === `${a.id}/${f.id}`) || null;

function parseSeq(src) {
  const out = { actors: [], msgs: [], notes: [], byDisplay: {} };
  const seen = new Set();
  const clean = s => norm(String(s).replace(/<br\s*\/?>/gi, " "));
  const add = (id, display) => {
    id = String(id || "").trim();
    if (!id || seen.has(id)) { return; }
    seen.add(id);
    const d = clean(display || id);
    out.actors.push({ id, display: d });
    out.byDisplay[d] = id;
  };
  for (const raw of String(src).split("\n")) {
    const l = raw.trim();
    let m;
    if (l.startsWith("%%")) {
      continue;
    }
    if ((m = l.match(/^(?:create\s+)?(?:participant|actor)\s+(.+?)(?:\s+as\s+(.+))?$/i))) {
      add(m[1], m[2]);
    } else if ((m = l.match(/^note\s+(?:left of|right of|over)\s+[^:]+:\s*(.*)$/i))) {
      out.notes.push(clean(m[1]));
    } else if ((m = l.match(/^(.+?)\s*(<<-{1,2}>>|-{1,2}(?:>>|>|x|\)))\s*[+-]?\s*(.+?)\s*:\s*(.*)$/))) {
      add(m[1]);
      add(m[3]);
      out.msgs.push({ from: m[1].trim(), to: m[3].trim(), text: clean(m[4]) });
    }
  }
  return out;
}

  const h = pop.offsetHeight;
  pop.style.left = clamp(x + 12, 8, innerWidth - w - 8) + "px";
  pop.style.top = clamp(y + 12, 8, innerHeight - h - 8) + "px";
  const ta = $("textarea", pop);
  ta.value = note.text || "";
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("input", () => {
    popState.dirty = true;
    const p = parsePrefix(ta.value);
    if (p) { setPopMark(p.mark, false); }
  });
}
function setPopMark(v, dirty = true) {
  if (!popState) { return; }
  popState.mark = v;
  if (dirty) { popState.dirty = true; }
  $$(".marks button", pop).forEach(b => b.classList.toggle("on", b.dataset.mark === v));
  $(".mark-name", pop).textContent = markOf(v).name;
}
function savePop() {
  if (!popState) { return; }
  let text = $("textarea", pop).value.trim();
  let mark = popState.mark;
  const p = parsePrefix(text);
  if (p) {
    mark = p.mark;
    text = p.rest;
  }
  const { note, isNew } = popState;
  popState = null;
  pop.hidden = true;
  if (!text && !mark) {
    if (!isNew) { removeNote(note.id); }
    return;
  }
  const saved = { ...note, text, mark, updated: now() };
  const i = notes.findIndex(n => n.id === saved.id);
  if (i >= 0) { notes[i] = saved; } else { notes.push(saved); }
  notesChanged();
  toast(isNew ? "Note saved" : "Note updated");
  live.flushReload();
  return saved;
}
function closePop(saveIfDirty) {
  if (popState && saveIfDirty && popState.dirty) {
    savePop();
    return;
  }
  popState = null;
  pop.hidden = true;
  live.flushReload();
}
function popAction(act) {
  if (!popState) { return; }
  if (act === "save") {
    savePop();
  } else if (act === "ask") {
    const saved = savePop();
    if (saved) { live.ask(saved); }
  } else if (act === "cancel") {
    closePop(false);
  } else if (act === "delete") {
    const id = popState.note.id;
    closePop(false);
    removeNote(id);
  } else if (act === "resolve") {
    const n = popState.note;
    popState.note = { ...n, status: n.status === "resolved" ? "open" : "resolved" };
    popState.dirty = true;
    savePop();
  }
}
document.addEventListener("mousedown", e => {
  if (!pop.hidden && !e.target.closest("#pop")) { closePop(true); }
});

// ── note mutations ──────────────────────────────────────────────────────
function notesChanged() {
  store.set(NOTES_KEY, notes);
  live.syncNotes();
  const r = readRoute();
  if (r.view === "notes") {
    render(false);
  } else {
    applyAnchors();
    renderSide(r);
  }
}
function removeNote(id) {
  notes = notes.filter(n => n.id !== id);
  notesChanged();
  toast("Note deleted");
}
function toggleResolve(id) {
  const n = noteById(id);
  if (!n) { return; }
  n.status = n.status === "resolved" ? "open" : "resolved";
  n.updated = now();
  notesChanged();
}
let pendingFocus = null;
function gotoNote(n) {
  const loc = locate(n);
  if (!loc.nid) {
    toast("Orphaned: its target is gone from the plan");
    return;
  }
  focusNid(loc.nid);
}
function focusNid(nid) {
  pendingFocus = nid;
  const route = (INDEX.get(nid) || {}).route || "explore";
  Object.assign(ex, { q: "", kind: "all", sev: "all", cat: "all", status: "all", origin: "all" });
  apiTree.q = "";
  closeDrawer();
  if (location.hash.slice(1) === route) { render(false); } else { location.hash = route; }
}
function focusPending(final) {
  if (!pendingFocus) { return; }
  const im = pendingFocus.match(/^areas\/([^/]+)\/issues\/([^/]+)\/./);
  if (im && drawer.hidden) { openDrawer({ kind: "issue", area: im[1], id: im[2] }, false); }
  const el = targetsFor(pendingFocus)[0];
  if (!el) {
    if (final) { pendingFocus = null; }
    return;
  }
  pendingFocus = null;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  const cls = isSvg(el) ? "pe-hover-svg" : "pe-flash";
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1700);
}

// ── export / import ─────────────────────────────────────────────────────
function noteExport(n) {
    const loc = locate(n);
    const reply = replyOf(n);
    return {
      id: n.id,
      mark: n.mark || null,
      markName: markOf(n.mark).name,
      status: statusOf(n),
      text: n.text,
      where: n.anchor.label,
      nid: loc.nid || n.anchor.nid,
      originalNid: n.anchor.nid,
      anchorState: loc.state,
      kind: n.anchor.kind,
      quote: n.anchor.quote,
      prefix: n.anchor.prefix,
      suffix: n.anchor.suffix,
      reply: reply ? reply.text : null,
      created: n.created,
      updated: n.updated
    };
}
function exportPayload() {
  const list = notes.map(noteExport);
  const count = f => list.filter(f).length;
  return {
    format: "plan-explorer-notes",
    engine: ENGINE_VERSION,
    plan: P.id || null,
    title: P.title,
    planVersion: P.version ?? null,
    page: decodeURIComponent(location.pathname),
    exportedAt: now(),
    counts: { total: list.length, open: count(n => n.status === "open"), answered: count(n => n.status === "answered"), resolved: count(n => n.status === "resolved"), orphaned: count(n => n.anchorState === "orphaned") },
    notes: list
  };
}
const exportJson = () => JSON.stringify(exportPayload(), null, 2);
function exportNotes() {
  const blob = new Blob([exportJson()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${P.id || "plan"}-notes-${now().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${notes.length} notes`);
}
function copyNotes() {
  const json = exportJson();
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("Copied notes JSON");
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(json).then(() => toast("Copied notes JSON"), fallback);
  } else {
    fallback();
  }
}
function fromExport(x) {
  if (!x || !x.id) { return null; }
  return {
    id: x.id,
    mark: x.mark || "",
    status: x.status === "resolved" ? "resolved" : "open",
    text: x.text || "",
    anchor: { nid: x.originalNid || x.nid, kind: x.kind || "element", quote: x.quote || "", prefix: x.prefix || "", suffix: x.suffix || "", label: x.where || x.nid },
    created: x.created || now(),
    updated: x.updated || now()
  };
}
function importNotes(file) {
  file.text().then(t => {
    const d = JSON.parse(t);
    const list = Array.isArray(d) ? d : (d.notes || []);
    let changed = 0;
    for (const x of list) {
      const n = fromExport(x);
      if (!n) { continue; }
      const i = notes.findIndex(y => y.id === n.id);
      if (i < 0) {
        notes.push(n);
        changed++;
      } else if ((n.updated || "") > (notes[i].updated || "")) {
        notes[i] = n;
        changed++;
      }
    }
    notesChanged();
    toast(`Imported ${changed} note${changed === 1 ? "" : "s"}`);
  }).catch(() => toast("Couldn't read that file"));
}
function clearNotes() {
  if (!notes.length) { return; }
  if (!confirm(`Delete all ${notes.length} notes from this browser? Export first if you want to keep them.`)) { return; }
  notes = [];
  notesChanged();
}

// ── lightbox, toast, theme ──────────────────────────────────────────────
const lightbox = $("#lightbox");
function openLightbox(canvas) {
  const f = FLOWS.get(canvas.dataset.flow);
  const svg = $("svg", canvas);
  if (!f || !svg) { return; }
  lightbox.innerHTML = `<div class="lb-head"><h2>${esc(f.title)}</h2><span class="kicker">Pinch or ⌘-scroll to zoom · scroll or drag to pan</span><button class="btn" data-act="lbclose">Close <kbd>Esc</kbd></button></div><div class="canvas lb-canvas" data-flow="${esc(canvas.dataset.flow)}"></div>`;
  lightbox.hidden = false;
  const c = $(".lb-canvas", lightbox);
  const clone = svg.cloneNode(true);
  clone.removeAttribute("style");
  c.appendChild(clone);
  initPanZoom(c, true);
}
function closeLightbox() {
  lightbox.hidden = true;
  lightbox.innerHTML = "";
}
let toastTimer = 0;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}
function setTheme(t) {
  if (t === "auto") { delete document.documentElement.dataset.theme; } else { document.documentElement.dataset.theme = t; }
  try { localStorage.setItem("pe:theme", t); } catch (e) {}
  render(false);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!document.documentElement.dataset.theme) { render(false); }
});

// ── global clicks & keys ────────────────────────────────────────────────
function handleAct(act, el) {
  const card = el.closest("[data-note]");
  const n = card ? noteById(card.dataset.note) : null;
  if (act === "notemode") {
    setNoteMode(!noteMode);
  } else if (act === "export") {
    exportNotes();
  } else if (act === "copy") {
    copyNotes();
  } else if (act === "clear") {
    clearNotes();
  } else if (act === "lbclose") {
    closeLightbox();
  } else if (n && act === "goto") {
    gotoNote(n);
  } else if (n && act === "edit") {
    const r = el.getBoundingClientRect();
    openPop(n, false, r.left, r.bottom);
  } else if (n && act === "ask") {
    live.ask(n);
  } else if (n && act === "resolve") {
    toggleResolve(n.id);
  } else if (n && act === "delete") {
    removeNote(n.id);
  }
}
document.addEventListener("click", e => {
  const t = e.target;
  let el;
  const inDrawer = !!t.closest("#drawer");
  if ((el = t.closest("[data-act]"))) {
    handleAct(el.dataset.act, el);
  } else if ((el = t.closest("[data-theme-set]"))) {
    setTheme(el.dataset.themeSet);
  } else if ((el = t.closest("[data-mark]")) && pop.contains(el)) {
    setPopMark(el.dataset.mark);
    $("textarea", pop).focus();
  } else if ((el = t.closest("[data-pop]"))) {
    popAction(el.dataset.pop);
  } else if ((el = t.closest("[data-pin]"))) {
    const r = el.getBoundingClientRect();
    openPop(noteById(el.dataset.pin), false, r.left - 400, r.bottom);
  } else if ((el = t.closest("[data-pz]"))) {
    const c = el.closest(".canvas");
    const act = el.dataset.pz;
    if (act === "in") { zoomPZ(c, 1.25); } else if (act === "out") { zoomPZ(c, 0.8); } else if (act === "fit") { fitPZ(c); } else if (act === "full") { openLightbox(c); }
  } else if ((el = t.closest("[data-dr]"))) {
    if (el.dataset.dr === "back") { drawerBack(); } else { closeDrawer(); }
  } else if ((el = t.closest("[data-open-issue]"))) {
    e.preventDefault();
    const [area, id] = el.getAttribute("data-open-issue").split("/");
    openDrawer({ kind: "issue", area, id }, inDrawer);
  } else if ((el = t.closest("[data-open-type]")) && (inDrawer || t.closest("#ex-results"))) {
    e.preventDefault();
    openDrawer({ kind: "type", id: el.getAttribute("data-open-type") }, inDrawer);
  } else if ((el = t.closest("[data-focus-nid]"))) {
    e.preventDefault();
    focusNid(el.getAttribute("data-focus-nid"));
  } else if ((el = t.closest("[data-ex]"))) {
    const [k, v] = el.getAttribute("data-ex").split(/:(.*)/s);
    ex[k] = ex[k] === v && k !== "kind" && k !== "status" ? "all" : v;
    render(false);
  } else if ((el = t.closest("[data-tree-dir]"))) {
    const d = el.getAttribute("data-tree-dir");
    if (apiTree.closed.has(d)) { apiTree.closed.delete(d); } else { apiTree.closed.add(d); }
    $("#apitree").innerHTML = treeHtml(typeById(readRoute().arg));
  } else if ((el = t.closest("[data-api-level]"))) {
    apiLevel = el.dataset.apiLevel;
    try { localStorage.setItem("pe:apiLevel", apiLevel); } catch (err) {}
    render(false);
  } else if ((el = t.closest("[data-fmark]"))) {
    ui.mark = el.dataset.fmark;
    render(false);
  } else if ((el = t.closest("[data-fstatus]"))) {
    ui.status = el.dataset.fstatus;
    render(false);
  } else if (t.closest(".canvas")) {
    diagramClick(e);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "exq") {
    ex.q = e.target.value;
    const box = $("#ex-results");
    box.innerHTML = exploreResults(areaById(readRoute().arg));
    applyAnchors();
    renderDiagrams(box, gen).then(applyAnchors);
  } else if (e.target.id === "apiq") {
    apiTree.q = e.target.value;
    $("#apitree").innerHTML = treeHtml(typeById(readRoute().arg));
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "imp" && e.target.files[0]) {
    importNotes(e.target.files[0]);
    e.target.value = "";
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Alt") { document.body.classList.add("altpick"); }
  const typing = e.target.closest && e.target.closest("textarea, input, [contenteditable]");
  if (e.key === "Escape") {
    if (!pop.hidden) {
      closePop(false);
    } else if (!lightbox.hidden) {
      closeLightbox();
    } else if (!drawer.hidden) {
      closeDrawer();
    } else if (noteMode) {
      setNoteMode(false);
    }
    hideSelBtn();
    return;
  }
  if (typing) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      popAction(e.shiftKey && live.on ? "ask" : "save");
    }
    return;
  }
  if (e.key.toLowerCase() === "n" && !e.metaKey && !e.ctrlKey && !e.altKey) { setNoteMode(!noteMode); }
});
const dropAlt = () => {
  document.body.classList.remove("altpick");
  if (!noteMode) { setHover(null); }
};
document.addEventListener("keyup", e => {
  if (e.key === "Alt") { dropAlt(); }
});
addEventListener("blur", dropAlt);

// ── routing & render ────────────────────────────────────────────────────
function readRoute() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [view, arg] = h.split("/");
  if (!view || view === "overview") { return { view: "explore", arg: "" }; }
  if (view === "area") { return { view: "explore", arg }; }
  if (view === "issues" || view === "flows") { return { view: "explore", arg: arg || "" }; }
  return { view, arg: arg || "" };
}
let gen = 0;
function render(resetScroll, keepY) {
  const r = readRoute();
  const g = ++gen;
  closePop(true);
  hideSelBtn();
  hideTip();
  closeLightbox();
  let html;
  let cls = "";
  if (r.view === "api" && apiTypes().length) {
    html = viewApi(r.arg);
    cls = " wide";
  } else if (r.view === "roadmap") {
    html = viewRoadmap();
  } else if (r.view === "notes") {
    html = viewNotes();
  } else {
    html = viewExplore(r.arg);
    cls = " mid";
  }
  const page = $("#page");
  page.className = "page" + cls;
  page.innerHTML = html;
  renderSide(r);
  if (resetScroll && !pendingFocus) { scrollTo(0, 0); }
  if (keepY != null) { scrollTo(0, keepY); }
  if (drawerCur) { openDrawer(drawerCur, false); }
  applyAnchors();
  focusPending(false);
  renderDiagrams(page, g).then(() => {
    if (g !== gen) { return; }
    if (keepY != null) { scrollTo(0, keepY); }
    applyAnchors();
    focusPending(true);
  });
}
function buildIndex() {
  const keep = { ...ex };
  Object.assign(ex, { q: "", kind: "all", sev: "all", cat: "all", status: "all", origin: "all" });
  viewExplore("");
  areas().forEach(a => viewExplore(a.id));
  allIssues().forEach(x => issueCard(x.a, x.i));
  viewRoadmap();
  if (apiTypes().length) {
    apiHome();
    apiTypes().forEach(t => apiTypePage(t));
    apiTypes().forEach(t => typeDetail(t, "full", true));
  }
  Object.assign(ex, keep);
}

// ── live bridge (optional: scripts/live.mjs serves the page) ─────────────
// From file:// or without a token the page stays fully offline.
const live = (() => {
  const L = { on: false, agent: "offline", pending: new Set(), answers: {}, token: null, reloadWanted: false };
  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "content-type": "application/json", "x-live-token": L.token, ...(opts.headers || {}) } });
  L.asking = id => L.pending.has(id) || (L.answers[id] && L.answers[id].status === "working");
  L.sideHtml = () => {
    if (!L.on) { return ""; }
    const busy = [...L.pending].length;
    const cls = L.agent === "offline" ? "off" : busy ? "busy" : "on";
    const what = L.agent === "offline" ? "no agent listening" : L.agent === "exec" ? "agent command" : "agent listening";
    return `<div class="live ${cls}" title="Live bridge to the agent session"><span class="dot"></span><span>Live · ${what}${busy ? ` · ${busy} waiting` : ""}</span></div>`;
  };
  function refresh() {
    const r = readRoute();
    if (r.view === "notes") {
      render(false, scrollY);
    } else {
      renderSide(r);
      applyAnchors();
    }
    if (popState && !popState.isNew) {
      const box = $(".reply", pop);
      const rep = replyOf(popState.note);
      const html = rep ? replyHtml(rep) : "";
      if (box) { box.outerHTML = html; } else if (html) { $(".pop-where", pop).insertAdjacentHTML("afterend", html); }
    }
  }
  let syncTimer = null;
  L.syncNotes = () => {
    if (!L.on) { return; }
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      api("live/notes", { method: "PUT", body: JSON.stringify({ raw: notes, export: exportPayload() }) }).catch(() => {});
    }, 300);
  };
  L.ask = n => {
    if (!L.on) { return; }
    const ex = noteExport(n);
    const hit = INDEX.get(ex.nid);
    L.pending.add(n.id);
    delete L.answers[n.id];
    refresh();
    api("live/ask", { method: "POST", body: JSON.stringify({ note: ex, target: hit ? hit.text : "", route: location.hash, plan: P.id || null, planVersion: P.version ?? null }) })
      .then(r => r.json())
      .then(j => toast(j.agent === "offline" ? "Queued. No agent is listening yet." : "Sent to the agent"))
      .catch(() => toast("Couldn't reach the live server"));
  };
  L.flushReload = () => {
    if (L.reloadWanted && !popState) { reloadPlan(); }
  };
  function reloadPlan() {
    if (popState && popState.dirty) {
      L.reloadWanted = true;
      toast("Plan changed. It reloads when you close this note.");
      return;
    }
    L.reloadWanted = false;
    const s = document.createElement("script");
    s.src = `plan.js?v=${Date.now()}`;
    s.onload = () => {
      s.remove();
      if (!window.PLAN) { return; }
      const before = P.version;
      P = window.PLAN;
      document.title = P.title || "Plan Explorer";
      INDEX.clear();
      FLOWS.clear();
      buildIndex();
      render(false, scrollY);
      toast(P.version !== before ? `Plan updated to v${P.version}` : "Plan updated");
    };
    s.onerror = () => {
      s.remove();
      toast("plan.js failed to load. Keeping the last good version.");
    };
    window.PLAN = null;
    document.head.appendChild(s);
  }
  function connect() {
    const es = new EventSource(`live/events?t=${encodeURIComponent(L.token)}`);
    es.addEventListener("status", e => {
      const d = JSON.parse(e.data);
      L.agent = d.agent;
      L.pending = new Set(d.pending || []);
      refresh();
    });
    es.addEventListener("answer", e => {
      const d = JSON.parse(e.data);
      const was = L.answers[d.noteId];
      L.answers[d.noteId] = d;
      if (d.status === "done") { L.pending.delete(d.noteId); }
      refresh();
      if (d.status === "done" && (!was || was.status !== "done" || was.at !== d.at)) { toast("Agent replied"); }
    });
    es.addEventListener("plan", () => reloadPlan());
    es.onerror = () => {
      if (L.agent !== "offline") {
        L.agent = "offline";
        refresh();
      }
    };
  }
  function mergeNotes(remote) {
    if (!Array.isArray(remote)) { return false; }
    const byId = new Map(remote.map(n => [n.id, n]));
    let changed = false;
    for (const n of notes) {
      const r = byId.get(n.id);
      if (!r || (n.updated || "") > (r.updated || "")) {
        byId.set(n.id, n);
        changed = true;
      }
    }
    notes = [...byId.values()];
    store.set(NOTES_KEY, notes);
    return changed;
  }
  L.start = () => {
    if (!/^https?:$/.test(location.protocol)) { return; }
    const qs = new URLSearchParams(location.search);
    try {
      if (qs.get("t")) { sessionStorage.setItem("pe:live-token", qs.get("t")); }
      L.token = qs.get("t") || sessionStorage.getItem("pe:live-token");
    } catch (e) {
      L.token = qs.get("t");
    }
    if (!L.token) { return; }
    api("live/hello").then(r => (r.ok ? r.json() : null)).then(h => {
      if (!h) { return; }
      L.on = true;
      L.agent = h.agent;
      L.pending = new Set(h.pending || []);
      L.answers = h.answers || {};
      const localNewer = mergeNotes(h.notes);
      if (localNewer || !h.notes) { L.syncNotes(); }
      if (qs.get("t")) { history.replaceState(null, "", location.pathname + location.hash); }
      connect();
      render(false, scrollY);
    }).catch(() => {});
  };
  return L;
})();

buildIndex();
live.start();
addEventListener("hashchange", () => render(true));
addEventListener("resize", schedulePins);
new ResizeObserver(schedulePins).observe($("#page"));
render(true);
})();
</script>
</body>
